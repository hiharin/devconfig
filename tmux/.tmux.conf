# ── General ───────────────────────────────────────────────────────────────────
# Truecolor + let apps inside tmux see a 256color terminal
set  -g  default-terminal 'tmux-256color'
set  -ga terminal-overrides ',*256col*:RGB,xterm-256color:RGB'

set  -g  mouse on                 # drag borders to resize, click to select
set  -sg escape-time 10           # no lag on <Esc> in nvim
set  -g  focus-events on          # let nvim autoread / autosave on focus change
set  -g  history-limit 50000
set  -g  display-time 2000        # status messages linger 2s
set  -g  set-clipboard on

# 1-based windows/panes, and keep numbers contiguous as windows close
set  -g  base-index 1
setw -g  pane-base-index 1
set  -g  renumber-windows on

# ── Prefix ────────────────────────────────────────────────────────────────────
# C-a is easier to reach than C-b; press it twice to send a literal C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Key bindings ──────────────────────────────────────────────────────────────
# Reload config
bind r source-file ~/.tmux.conf \; display 'reloaded ~/.tmux.conf'

# Splits that inherit the current pane's working directory
bind '|' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'
bind 'c' new-window      -c '#{pane_current_path}'
unbind '"'
unbind %

# Resize panes with prefix + arrows, repeatable (hold the arrow)
bind -r Up    resize-pane -U 5
bind -r Down  resize-pane -D 5
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5

# Vi-style copy mode: v to select, y to yank
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi y      send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

set -g status-style              'bg=#1a1b26,fg=#a9b1d6'
set -g status-left               ' #[bold]#S#[nobold] '
set -g status-left-length        30
# Working dir as `-> parent/current` (last two path components)
set -g status-right              '#[fg=#7aa2f7]-> #{s|.*/([^/]+/[^/]+)/?$|\1|:pane_current_path}  #[fg=#a9b1d6]%a %d %b %H:%M '
set -g status-right-length       120

setw -g window-status-current-style 'bg=#7aa2f7,fg=#1a1b26,bold'
setw -g window-status-current-format ' #I:#W#{?window_zoomed_flag, ,} '
setw -g window-status-format         ' #I:#W '

set -g pane-border-style         'fg=#3b4261'
set -g pane-active-border-style   'fg=#7aa2f7'
set -g message-style             'bg=#7aa2f7,fg=#1a1b26'
