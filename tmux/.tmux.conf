# Enable mouse support (drag pane borders to resize, click to select panes)
set -g mouse on

# Resize panes with prefix + arrow keys, repeatable (hold arrow after one press)
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5

# Show the focused pane's working directory in the status bar
set -g status-right '#{b:pane_current_path} %H:%M'
